name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'mintlify-docs/**'
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Deploy Documentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify documentation files
        run: |
          echo "📋 Checking documentation files..."
          [ -f "mintlify-docs/index.html" ] && echo "✅ index.html found" || echo "❌ index.html missing"
          [ -f "mintlify-docs/docs.json" ] && echo "✅ docs.json found" || echo "❌ docs.json missing"
          echo ""
          echo "📂 mintlify-docs contents:"
          ls -la mintlify-docs/ | grep -E "\.html|\.json|^d" | head -15

      - name: Sync documentation to docs directory
        run: |
          echo "🔄 Syncing documentation files..."
          mkdir -p docs

          # Copy all essential files
          cp mintlify-docs/index.html docs/ 2>/dev/null || true
          cp mintlify-docs/docs.json docs/ 2>/dev/null || true
          cp mintlify-docs/openapi.json docs/ 2>/dev/null || true
          cp mintlify-docs/*.mdx docs/ 2>/dev/null || true
          cp mintlify-docs/favicon.svg docs/ 2>/dev/null || true

          # Copy directories
          for dir in get-started core-concepts guides reference assets operations; do
            [ -d "mintlify-docs/$dir" ] && cp -r mintlify-docs/$dir docs/
          done

          echo "✅ Documentation synced"
          echo ""
          echo "📊 docs/ directory contents:"
          find docs -type f -not -path "*/node_modules/*" | sort

      - name: Commit and push docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Check if there are changes
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "docs: update documentation from mintlify-docs [skip ci]"
            git push origin main
            echo "✅ Documentation committed and pushed"
          else
            echo "⏭️  No changes to documentation"
          fi

      - name: Deployment Summary
        run: |
          echo "🚀 Deployment Summary"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📍 Documentation URL:"
          echo "   https://hungyann.github.io/arbitrage_tool/"
          echo ""
          echo "📂 Files deployed:"
          find docs -type f -not -path "*/node_modules/*" | wc -l
          echo ""
          echo "⏱️  Deployment completed at: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
