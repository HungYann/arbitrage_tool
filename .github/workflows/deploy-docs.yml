name: Deploy Mintlify Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'mintlify-docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Mintlify Documentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: mintlify-docs
        run: |
          echo "📦 Installing Node.js dependencies..."
          npm install --no-audit --no-fund
          echo "✅ Dependencies installed"

      - name: Check for broken links
        working-directory: mintlify-docs
        run: npm run broken-links || echo "⚠️ Some broken links found, continuing..."

      - name: Verify documentation setup
        run: |
          echo "📋 Verifying Mintlify documentation structure..."
          if [ ! -f "mintlify-docs/docs.json" ]; then
            echo "❌ ERROR: docs.json not found!"
            exit 1
          fi
          if [ ! -f "mintlify-docs/index.html" ]; then
            echo "⚠️ WARNING: index.html not found in mintlify-docs/"
          fi
          echo "✅ Documentation files verified"

      - name: Create deployment directory
        run: |
          echo "🔨 Preparing deployment package..."
          mkdir -p _deploy

          # Copy all documentation files
          cp -r mintlify-docs/index.html _deploy/ 2>/dev/null || echo "⚠️ index.html not found"
          cp -r mintlify-docs/docs.json _deploy/ 2>/dev/null || true
          cp -r mintlify-docs/openapi.json _deploy/ 2>/dev/null || true
          cp -r mintlify-docs/*.mdx _deploy/ 2>/dev/null || true

          # Copy documentation directories
          [ -d "mintlify-docs/get-started" ] && cp -r mintlify-docs/get-started _deploy/
          [ -d "mintlify-docs/core-concepts" ] && cp -r mintlify-docs/core-concepts _deploy/
          [ -d "mintlify-docs/guides" ] && cp -r mintlify-docs/guides _deploy/
          [ -d "mintlify-docs/reference" ] && cp -r mintlify-docs/reference _deploy/
          [ -d "mintlify-docs/assets" ] && cp -r mintlify-docs/assets _deploy/

          echo "✅ Deployment directory prepared"
          echo ""
          echo "📋 Deployment package contents:"
          find _deploy -type f | sort
          echo ""
          echo "📊 Total files: $(find _deploy -type f | wc -l)"

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
          name: 'github-pages'
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy static HTML to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'

      - name: Deployment Summary
        run: |
          echo "✅ Deployment completed!"
          echo ""
          echo "📊 Deployment Information:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📖 Documentation URL:"
          echo "   ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "🔗 Direct links:"
          echo "   Home: ${{ steps.deployment.outputs.page_url }}"
          echo "   API: ${{ steps.deployment.outputs.page_url }}reference/api-overview.html"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "⏱️  Deployment time: $(date)"
          echo "✨ Visit your documentation in 1-2 minutes"
