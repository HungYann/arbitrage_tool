name: Deploy Mintlify Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'mintlify-docs/**'
      - '.github/workflows/deploy-docs.yml'
  # Allow manual trigger from Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Mintlify Documentation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mintlify-docs/package-lock.json'

      - name: Install dependencies
        working-directory: mintlify-docs
        run: npm ci

      - name: Check for broken links
        working-directory: mintlify-docs
        run: npm run broken-links || echo "⚠️ Some broken links found, continuing..."

      - name: Verify documentation setup
        run: |
          echo "📋 Verifying Mintlify documentation structure..."
          if [ ! -f "mintlify-docs/docs.json" ]; then
            echo "❌ ERROR: docs.json not found!"
            exit 1
          fi
          if [ ! -f "mintlify-docs/index.html" ]; then
            echo "⚠️ WARNING: index.html not found in mintlify-docs/"
          fi
          echo "✅ Documentation files verified"

      - name: Create deployment directory
        run: |
          mkdir -p _deploy
          cp -r mintlify-docs/* _deploy/
          echo "✅ Deployment directory prepared"
          ls -la _deploy/ | head -20

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_deploy'
          name: 'github-pages'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy static HTML to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: 'github-pages'

      - name: Deployment Summary
        run: |
          echo "📚 Documentation deployed successfully!"
          echo "📖 URL: ${{ steps.deployment.outputs.page_url }}"
          echo "⏱️  Deployment completed at $(date)"
