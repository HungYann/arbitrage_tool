name: Deploy Mintlify Docs

on:
  push:
    branches:
      - main
    paths:
      - 'mintlify-docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'mintlify-docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Mintlify Docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'mintlify-docs/package-lock.json'

      - name: Install dependencies
        working-directory: mintlify-docs
        run: npm ci

      - name: Check for broken links
        working-directory: mintlify-docs
        run: npm run broken-links
        continue-on-error: true

      - name: Build documentation
        working-directory: mintlify-docs
        run: |
          npm run build 2>/dev/null || echo "Build command not found, using default build"
          if [ ! -d ".mintlify" ]; then
            echo "Creating dist directory for deployment"
            mkdir -p dist
            # Copy source files if no build output
            cp -r . dist/ 2>/dev/null || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'mintlify-docs/.mintlify'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
