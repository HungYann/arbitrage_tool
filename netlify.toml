[build]
# Build command - export Mintlify with detailed diagnostics
command = "cd mintlify-docs && npm install && echo '=== Starting mintlify export ===' && npm run build && echo '=== Build completed ===' && echo '=== Directory contents ===' && find . -maxdepth 2 -type d | head -20 && echo '=== Looking for export output ===' && ([ -d .mintlify ] && echo 'Found .mintlify' && cp -r .mintlify ../public || [ -d dist ] && echo 'Found dist' && cp -r dist ../public || [ -d .next ] && echo 'Found .next' && cp -r .next ../public || (echo 'Using source as public' && cp -r . ../public))"

# Directory to publish
publish = "public"

# Node version (Mintlify requires 20.17+)
NODE_VERSION = "20.17.0"

[build.environment]
# Skip Puppeteer downloads for faster builds
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NODE_VERSION = "20.17.0"

# Redirect all requests to index.html for client-side routing (if needed)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Set cache headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "max-age=3600, s-maxage=3600"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "max-age=31536000, immutable"
