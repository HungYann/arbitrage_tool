[build]
# Build command - use pre-built documentation
command = "cp -r docs public && echo 'Documentation ready for deployment'"

# Directory to publish
publish = "public"

# Node version (Mintlify requires 20.17+)
NODE_VERSION = "20.17.0"

[build.environment]
# Skip Puppeteer downloads for faster builds
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NODE_VERSION = "20.17.0"

# Redirect all requests to index.html for client-side routing (if needed)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Set cache headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "max-age=3600, s-maxage=3600"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "max-age=31536000, immutable"
