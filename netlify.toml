[build]
# Build command - use npm build script for Mintlify export
command = "cd mintlify-docs && npm install && npm run build && ls -la && ([ -d .mintlify ] && cp -r .mintlify ../public || [ -d dist ] && cp -r dist ../public || cp -r . ../public && echo 'Using source directory as fallback')"

# Directory to publish
publish = "public"

# Node version (Mintlify requires 20.17+)
NODE_VERSION = "20.17.0"

[build.environment]
# Skip Puppeteer downloads for faster builds
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NODE_VERSION = "20.17.0"

# Redirect all requests to index.html for client-side routing (if needed)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Set cache headers
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "max-age=3600, s-maxage=3600"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "max-age=31536000, immutable"
